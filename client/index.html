<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags -->
    <!-- Keep in sync with src/lib/seo.ts constants (SITE_URL / SITE_TITLE / SITE_DESCRIPTION / OG_IMAGE). -->
    <title>Docket — Tests from screens & specs in one click.</title>
    <meta name="description" content="Drop a screenshot. Paste a PRD. Docket generates a complete, executable test matrix — covering happy paths, edge cases, and error states — in seconds, not hours." />
    <meta name="theme-color" content="#f9f9f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://client-indol-two-76.vercel.app/" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:title" content="Docket — Tests from screens & specs in one click." />
    <meta property="og:description" content="Drop a screenshot. Paste a PRD. Docket generates a complete, executable test matrix — covering happy paths, edge cases, and error states — in seconds, not hours." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Docket" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://client-indol-two-76.vercel.app/" />
    <meta property="og:image" content="https://client-indol-two-76.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Docket — tests generated from screenshots and PRDs, executed with evidence, exported as a report." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Docket — Tests from screens & specs in one click." />
    <meta name="twitter:description" content="Drop a screenshot. Paste a PRD. Docket generates a complete, executable test matrix — covering happy paths, edge cases, and error states — in seconds, not hours." />
    <meta name="twitter:image" content="https://client-indol-two-76.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Docket — tests generated from screenshots and PRDs, executed with evidence, exported as a report." />

    <!-- App icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data (see src/pages/Marketing.tsx for the FAQPage block, which is built from the page's FAQ data) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Docket",
      "url": "https://client-indol-two-76.vercel.app/"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Docket",
      "url": "https://client-indol-two-76.vercel.app/",
      "logo": "https://client-indol-two-76.vercel.app/favicon.svg"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Docket",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "url": "https://client-indol-two-76.vercel.app/",
      "description": "AI test case generation from screenshots and PRDs — generate, execute with evidence, and export a shareable test report.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free plan; paid tiers for teams" }
    }
    </script>

    <!-- Font: preconnect + async loading for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical CSS for above-the-fold content with font fallback stacks -->
    <style>
      body { margin: 0; background: #f9f9f8; }
      .dark body { background: #121414; }
      #root { min-height: 100svh; }
      /* Font fallback stack so text is visible immediately */
      h1, h2, h3, h4 { font-family: 'Geist', system-ui, sans-serif; }
      body, p, span, div { font-family: 'Inter', system-ui, sans-serif; }
      code, pre, kbd { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>

    <!-- Non-critical fonts load asynchronously (no render-blocking) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;450;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <!-- Fallback for browsers without JS -->
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;450;500;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
