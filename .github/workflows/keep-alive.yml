name: Keep Render API warm

# Render's free tier spins the service down after ~15 min of idle traffic;
# the first request after that takes 30-60s to wake. Pinging /api/health
# every 5 minutes keeps an instance warm without any secrets or cost.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -sf -o /dev/null -m 60 https://docket-api-pb0d.onrender.com/api/health
